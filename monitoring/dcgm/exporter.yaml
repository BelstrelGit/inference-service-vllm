# NVIDIA dcgm-exporter on the L4 node. Adapted from Google's GKE example
# (github.com/GoogleCloudPlatform/prometheus-engine, examples/nvidia-dcgm/exporter.yaml,
# Apache 2.0): namespace monitoring, Prometheus Operator PodMonitor instead of GMP, 5 s
# collection, resources, our counter list.
#
# It does NOT request nvidia.com/gpu: the only L4 belongs to vLLM. It reaches the GPU through
# the GKE-installed driver (hostPath /home/kubernetes/bin/nvidia) in a privileged container.
# Default here: the embedded DCGM hostengine (one DaemonSet). If it cannot see the GPU on GKE
# COS, switch to Google's two-DaemonSet layout: monitoring/dcgm/hostengine.yaml (README).
# Image: newest ubuntu22.04 tag on nvcr.io as of 2026-10-20 (DCGM 4.5.2); re-check at install.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-accelerator
                    operator: Exists
      tolerations:
        - operator: Exists
      volumes:
        - name: counters
          configMap:
            name: dcgm-exporter-counters
        - name: nvidia-install-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
          command: ["/bin/bash", "-c"]
          # Two-DaemonSet fallback: append  --remote-hostengine-info $(NODE_IP)
          args:
            - hostname $NODE_NAME; exec dcgm-exporter --collectors /etc/dcgm-exporter/counters.csv
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            - name: DCGM_EXPORTER_KUBERNETES # adds pod / namespace labels of the GPU's user
              value: "true"
            - name: DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE
              value: device-name
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            - name: DCGM_EXPORTER_INTERVAL # ms; default 30000 is too coarse for 2-6 min runs
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: counters
              mountPath: /etc/dcgm-exporter
              readOnly: true
            - name: nvidia-install-dir-host
              mountPath: /usr/local/nvidia
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dcgm-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 5s
