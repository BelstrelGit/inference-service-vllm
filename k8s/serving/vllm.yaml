# M1: vLLM as a Deployment + ClusterIP Service (successor of k8s/standalone/vllm-pod.yaml).
#
# Same image / model / memory settings as the standalone run; additionally pins the engine
# defaults observed in that run, so a future vLLM default change cannot silently alter a series:
#   max-num-seqs 256, max-num-batched-tokens 2048, prefix caching on, chunked prefill on.
# --generation-config vllm: ignore the model's generation_config.json sampling defaults
#   (temperature 0.7, top_k 20, top_p 0.8, repetition_penalty 1.05); requests set sampling.
#
# One GPU in the project -> strategy Recreate (RollingUpdate would wait for a 2nd GPU forever).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Without this, the Service named `vllm` injects VLLM_PORT=tcp://<ip>:8000 (and other
      # VLLM_* service-link env vars), which vLLM reads as its own config and fails to start.
      enableServiceLinks: false
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      terminationGracePeriodSeconds: 30
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
          args:
            - Qwen/Qwen2.5-7B-Instruct
            - --revision=a09a35458c702b33eeacc393d103063234e8bc28
            - --tokenizer-revision=a09a35458c702b33eeacc393d103063234e8bc28
            - --dtype=bfloat16
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
            - --max-num-seqs=256
            - --max-num-batched-tokens=2048
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --generation-config=vllm
            - --seed=0
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /models/hf
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "6"
              memory: 24Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 40Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
# In-cluster address: http://vllm.vllm.svc.cluster.local:8000
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
