# Exp4 (docs/experiments/EXP_005_KV_PRESSURE.md): baseline server + --num-gpu-blocks-override=2517.
# KV pool cut to 0.75x the profiled 3356 blocks (40,272 tokens); compute unchanged.
#   kubectl apply -k k8s/exp4/kv2517
resources:
  - ../../serving
patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --num-gpu-blocks-override=2517
