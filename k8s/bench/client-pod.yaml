# Load-generator Pod: runs the client (client.load / client.run) inside the cluster against
# the vLLM Service, so the measured path is Pod -> Service -> Pod (no laptop, no port-forward).
# Code and run arguments come from ConfigMaps created by scripts/run-bench.sh; results stay
# in /out until the script copies them out, then the Pod is deleted.
apiVersion: v1
kind: Pod
metadata:
  name: bench-client
  namespace: vllm
  labels:
    app: bench-client
spec:
  restartPolicy: Never
  # Keep the client off the GPU node: it must not compete with vLLM for CPU.
  nodeSelector:
    cloud.google.com/gke-nodepool: default-pool
  containers:
    - name: client
      image: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      workingDir: /app
      command: ["sh", "-c"]
      args:
        - |
          set -e
          pip install --quiet --no-cache-dir --root-user-action=ignore \
            httpx==0.28.1 httpcore==1.0.9 h11==0.16.0 anyio==4.15.1 certifi==2026.7.22 idna==3.20 \
            pyyaml==6.0.3
          export CLIENT_GIT_COMMIT="$(cat /run-config/git_commit)" CLIENT_GIT_DIRTY="$(cat /run-config/git_dirty)"
          rc=0
          python -m "$(cat /run-config/module)" $(cat /run-config/args) --out-dir /out || rc=$?
          echo "$rc" > /out/.exit_code
          # stay alive so the results can be copied out with kubectl cp
          sleep 3600
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
      resources:
        requests:
          # system node is e2-standard-2: ~1.07 CPU left after GKE system pods
          cpu: 900m
          memory: 256Mi
      volumeMounts:
        - name: client-code
          mountPath: /app/client
        - name: scenarios
          mountPath: /app/configs/scenarios
        - name: run-config
          mountPath: /run-config
        - name: out
          mountPath: /out
  volumes:
    - name: client-code
      configMap:
        name: bench-client-code
    - name: scenarios
      configMap:
        name: bench-scenarios
    - name: run-config
      configMap:
        name: bench-run-config
    - name: out
      emptyDir: {}
